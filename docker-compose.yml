version: '3.8'

services:
  mongo1:
    image: mongo:latest
    container_name: mongo_nexus_1
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo_data1:/data/db
    networks:
      - mongo_net

  mongo2:
    image: mongo:latest
    container_name: mongo_nexus_2
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    volumes:
      - mongo_data2:/data/db
    networks:
      - mongo_net

  mongo3:
    image: mongo:latest
    container_name: mongo_nexus_3
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    volumes:
      - mongo_data3:/data/db
    networks:
      - mongo_net

volumes:
  mongo_data1:
  mongo_data2:
  mongo_data3:

networks:
  mongo_net:
    driver: bridge